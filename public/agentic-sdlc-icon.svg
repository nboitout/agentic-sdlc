<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="Agentic SDLC">
  <title>Agentic SDLC</title>
  <desc>A dark icon showing an agent, rendered as a mini terminal window, at the crossing of a continuous integration and delivery figure-eight loop, framed by corner brackets that represent the agent harness.</desc>

  <rect width="140" height="140" rx="22" fill="#15172C"/>

  <g stroke="#DCD8F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
    <polyline points="30,38 18,38 18,50"/>
    <polyline points="110,38 122,38 122,50"/>
    <polyline points="18,90 18,102 30,102"/>
    <polyline points="122,90 122,102 110,102"/>
  </g>

  <path d="M 70 70 C 70 35, 115 35, 115 70 C 115 105, 70 105, 70 70 Z" fill="#DCD8F5" opacity="0.18"/>
  <path d="M 70 70 C 70 35, 25 35, 25 70 C 25 105, 70 105, 70 70" fill="none" stroke="#7B72FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 70 70 C 70 35, 115 35, 115 70 C 115 105, 70 105, 70 70" fill="none" stroke="#7B72FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="70" cy="70" r="14" fill="#15172C"/>
  <rect x="58" y="60" width="24" height="20" rx="2.5" fill="#DCD8F5"/>
  <line x1="58" y1="66.5" x2="82" y2="66.5" stroke="#15172C" stroke-width="0.8"/>
  <circle cx="61.5" cy="63.5" r="0.9" fill="#15172C"/>
  <circle cx="64.5" cy="63.5" r="0.9" fill="#15172C"/>
  <circle cx="67.5" cy="63.5" r="0.9" fill="#15172C"/>
  <path d="M 62 71 L 66 74 L 62 77" fill="none" stroke="#15172C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="68.5" y1="77" x2="74" y2="77" stroke="#15172C" stroke-width="1.2" stroke-linecap="round"/>
</svg>
